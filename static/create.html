<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>创意器 · 对画</title>
  <link rel="stylesheet" href="/static/create.css">
</head>
<body>
  <header class="bar">
    <a class="ghost" href="/">返回对话</a>
    <div><strong>创意器</strong><span>电商图</span></div>
    <a class="ghost" href="/mind.html">导图</a>
  </header>
  <main>
    <section class="panel">
      <p class="lead">写一句大概的思路，也可以不写。先看三个方向，点一张再生图。</p>
      <div id="auth" class="warn hidden">请先回对话页登录。</div>
      <label class="upload">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <img id="preview" alt="" class="hidden">
        <span id="uploadText">上传商品图，可不传</span>
      </label>
      <textarea id="idea" rows="3" placeholder="例如：夏天、干净、想要高级感。留空也可以。"></textarea>
      <div class="field">
        <span>类目</span>
        <div id="categories" class="chips"></div>
      </div>
      <div class="field">
        <span>用途</span>
        <div id="uses" class="chips"></div>
      </div>
      <div class="field">
        <span>张数</span>
        <div id="counts" class="chips"></div>
      </div>
      <button id="plan" type="button">想三个方向</button>
      <div id="error" class="error"></div>
    </section>
    <section id="directions" class="directions"></section>
  </main>
  <script src="/static/create.js"></script>
</body>
</html>
